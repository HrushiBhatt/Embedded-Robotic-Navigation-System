  <text x="716" y="220" class="mt" font-size="12">▸ hazard interlocks</text>
  <text x="716" y="239" class="mt" font-size="12">▸ scan + segmentation</text>
  <text x="716" y="258" class="mt" font-size="12">▸ TIMER5 µs timebase</text><text x="40" y="420" class="m" font-size="12"><tspan fill="#a78bfa">●</tspan> single-char commands (w a s d 1 2 9 0 q)     <tspan fill="#22e584">●</tspan> scan records · heading/odometry · hazard reports     <tspan fill="#38bdf8">- - -</tspan> register-level peripheral I/O</text>
