  <text x="40" y="76" class="m" font-size="13">Commands flow right, telemetry flows left: one shared serial link, interrupt-driven on the MCU</text><rect x="985" y="100" width="185" height="62" rx="12" fill="#111d30" stroke="#38bdf8" stroke-opacity="0.7"/><text x="999" y="126" class="h" font-size="14">Sharp IR sensor</text><text x="999" y="145" class="m" font-size="10.5">ADC0 SS3 · PB4 · 16× avg</text><path d="M930 230 C958 230 958 131 985 131" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/></path><rect x="985" y="178" width="185" height="62" rx="12" fill="#111d30" stroke="#38bdf8" stroke-opacity="0.7"/><text x="999" y="204" class="h" font-size="14">Scan servo</text><text x="999" y="223" class="m" font-size="10.5">libcybotScan · 0–180°</text><path d="M930 230 C958 230 958 209 985 209" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/></path><rect x="985" y="256" width="185" height="62" rx="12" fill="#111d30" stroke="#f25f5c" stroke-opacity="0.7"/><text x="999" y="282" class="h" font-size="14">iRobot Create 2</text><text x="999" y="301" class="m" font-size="10.5">Open Interface · UART4</text><path d="M930 230 C958 230 958 287 985 287" fill="none" stroke="#f25f5c" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/></path><rect x="985" y="334" width="185" height="62" rx="12" fill="#111d30" stroke="#7b8aa3" stroke-opacity="0.7"/><text x="999" y="360" class="h" font-size="14">20×4 LCD</text><text x="999" y="379" class="m" font-size="10.5">4-bit GPIO · Port D/F</text><path d="M930 230 C958 230 958 365 985 365" fill="none" stroke="#7b8aa3" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur="1s" repeatCount="indefinite"/></path><path d="M310 205 L420 205" stroke="#7b8aa3" stroke-width="1.5" marker-end="url(#arr)"/><path d="M420 255 L310 255" stroke="#7b8aa3" stroke-width="1.5" marker-end="url(#arr)"/><path d="M590 205 L700 205" stroke="#7b8aa3" stroke-width="1.5" marker-end="url(#arr)"/><path d="M700 255 L590 255" stroke="#7b8aa3" stroke-width="1.5" marker-end="url(#arr)"/><text x="365" y="190" class="m" font-size="11" text-anchor="middle">TCP</text><text x="645" y="190" class="m" font-size="11" text-anchor="middle">UART1</text><text x="645" y="280" class="m" font-size="10" text-anchor="middle">115200 8-N-1</text><g opacity="0"><rect x="-18.1" y="-11" width="36.2" height="22" rx="11" fill="#a78bfa"/><text x="0" y="4.5" class="mt" font-size="12" font-weight="700" text-anchor="middle" style="fill:#0b1220">'w'</text><animateMotion path="M310 205 L700 205" dur="2.4s" begin="0.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.65;0.7;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></g><g opacity="0"><rect x="-18.1" y="-11" width="36.2" height="22" rx="11" fill="#a78bfa"/><text x="0" y="4.5" class="mt" font-size="12" font-weight="700" text-anchor="middle" style="fill:#0b1220">'2'</text><animateMotion path="M310 205 L700 205" dur="2.4s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.65;0.7;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></g><g opacity="0"><rect x="-18.1" y="-11" width="36.2" height="22" rx="11" fill="#a78bfa"/><text x="0" y="4.5" class="mt" font-size="12" font-weight="700" text-anchor="middle" style="fill:#0b1220">'a'</text><animateMotion path="M310 205 L700 205" dur="2.4s" begin="1.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.65;0.7;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></g><g opacity="0"><rect x="-47.7" y="-11" width="95.4" height="22" rx="11" fill="#22e584"/><text x="0" y="4.5" class="mt" font-size="12" font-weight="700" text-anchor="middle" style="fill:#0b1220">Min Degree…</text><animateMotion path="M700 255 L310 255" dur="2.4s" begin="0.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.65;0.7;1" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></g><g opacity="0"><rect x="-51.4" y="-11" width="102.8" height="22" rx="11" fill="#22e584"/><text x="0" y="4.5" class="mt" font-size="12" font-weight="700" text-anchor="middle" style="fill:#0b1220">Angle: 90.0…</text><animateMotion path="M700 255 L310 255" dur="2.4s" begin="1.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.65;0.7;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></g><rect x="40" y="130" width="270" height="200" rx="14" fill="#111d30" stroke="#a78bfa" stroke-opacity="0.75" stroke-width="1.5"/>
